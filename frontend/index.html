<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angels Brows Shaping — Check-In</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff; color: #111; margin: 0; padding: 32px 16px; }
    .container { max-width: 440px; margin: 0 auto; }
    h1 { margin-bottom: 4px; }
    p.sub { color: #555; margin-top: 0; margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 14px; }
    input { width: 100%; padding: 12px; margin-top: 6px; border: 1.5px solid #222; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 6px; margin-bottom: 14px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; padding: 28px; border-radius: 12px; max-width: 400px; width: 100%; border: 2px solid #111; }
    .promo-box { background: #fff7ed; border: 1.5px solid #f97316; color: #9a3412; padding: 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
    .reward-box { background: #eff6ff; border: 1.5px solid #2563eb; color: #1e40af; padding: 12px; border-radius: 8px; margin: 12px 0; }
    .btn-redeem { background: #2563eb; margin-top: 8px; }
    .btn-done { background: #111; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Angels Brows Shaping</h1>
    <p class="sub">Check in below to track visits and unlock rewards.</p>

    <form id="checkin-form">
      <label>Full Name *
        <input type="text" id="name" required placeholder="e.g. Maya Patel" />
      </label>

      <label>Phone Number *
        <input type="tel" id="phone" required placeholder="(703) 555-0199" />
      </label>

      <label>Friend's Phone Number (Optional — New Customers)
        <input type="tel" id="referred-phone" placeholder="Referred by a friend?" />
      </label>

      <div id="error-box" class="error" style="display: none;"></div>

      <button type="submit" id="submit-btn">Check In</button>
    </form>
  </div>

  <!-- Pop-Up Modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title" style="margin-top: 0;"></h2>
      <p id="modal-visits"></p>

      <div id="promo-box" class="promo-box" style="display: none;"></div>

      <div id="reward-box" class="reward-box" style="display: none;">
        <div id="reward-text"></div>
        <button type="button" id="redeem-btn" class="btn-redeem">Redeem 1 Discount Now</button>
      </div>

      <p id="redeem-status" style="color: #15803d; font-weight: 600;"></p>
      <button type="button" id="done-btn" class="btn-done">Done (Next Customer)</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
