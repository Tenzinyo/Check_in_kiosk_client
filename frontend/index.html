<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angels Brows Shaping — Welcome & Check-In</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-blush: #fff7f9;
      --card-bg: #ffffff;
      --rose-primary: #d9778b;
      --rose-dark: #b8566b;
      --rose-soft: #fce8ed;
      --gold-accent: #d4a373;
      --text-main: #3d2c31;
      --text-muted: #7a6168;
      --border-soft: #f3d5dc;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at top left, #ffeef2 0%, #fff9f5 50%, #fdf2f6 100%);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 2px solid var(--border-soft);
      border-radius: 28px;
      padding: 36px 30px;
      box-shadow: 0 18px 40px rgba(217, 119, 139, 0.14);
      position: relative;
      overflow: hidden;
    }

    .welcome-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--rose-soft);
      color: var(--rose-dark);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      margin: 0 0 6px;
      color: var(--text-main);
    }

    .sub {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .label-hint {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 12.5px;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      margin-top: 6px;
      border: 1.5px solid var(--border-soft);
      background: #fffcfd;
      border-radius: 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--rose-primary);
      box-shadow: 0 0 0 4px rgba(217, 119, 139, 0.15);
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      background: linear-gradient(135deg, #e08296 0%, #c96278 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(201, 98, 120, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(201, 98, 120, 0.35);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .perk-note {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 16px;
      margin-bottom: 0;
    }

    .error {
      background: #fff1f2;
      border: 1.5px solid #fda4af;
      color: #be123c;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* Celebration Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(61, 44, 49, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #ffffff;
      padding: 32px 26px;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      border: 2px solid var(--border-soft);
      box-shadow: 0 24px 50px rgba(61, 44, 49, 0.22);
      text-align: center;
      animation: popIn 0.24s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--rose-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    #modal-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 25px;
      margin: 0 0 6px;
      color: var(--text-main);
    }

    .thank-you-note {
      font-size: 14.5px;
      color: var(--rose-dark);
      font-weight: 600;
      margin: 0 0 12px;
    }

    #modal-visits {
      background: #fff9fb;
      border: 1px dashed var(--rose-primary);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14.5px;
      color: var(--text-main);
      margin: 12px 0;
    }

    .promo-box {
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      color: #92400e;
      padding: 12px 14px;
      border-radius: 14px;
      margin: 12px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .reward-box {
      background: #fdf2f8;
      border: 1.5px solid #f472b6;
      color: #9d174d;
      padding: 14px;
      border-radius: 16px;
      margin: 12px 0;
      font-weight: 600;
    }

    .btn-redeem {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      margin-top: 10px;
      box-shadow: 0 6px 16px rgba(219, 39, 119, 0.25);
    }

    .btn-done {
      background: #3d2c31;
      margin-top: 12px;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="welcome-pill">✨ Welcome to Your Glow-Up ✨</div>
    <h1>Angels Brows Shaping</h1>
    <p class="sub">So happy you're here! Check in below to collect loyalty visits &amp; sweet rewards. 💖</p>

    <form id="checkin-form">
      <label>
        Your Beautiful Name *
        <input type="text" id="name" required placeholder="e.g. Jane Doe" />
      </label>

      <label>
        Phone Number *
        <input type="tel" id="phone" required placeholder="(703) 555-0199" />
      </label>

      <label>
        Bestie's Phone Number <span class="label-hint">(Optional — New Guests)</span>
        <input type="tel" id="referred-phone" placeholder="Referred by a friend? Gift them a reward! 🎀" />
      </label>

      <div id="error-box" class="error" style="display: none;"></div>

      <button type="submit" id="submit-btn">✨ Check In &amp; Glow ✨</button>
    </form>

    <p class="perk-note">🌸 Every 10th visit unlocks a special discount just for you 🌸</p>
  </div>

  <!-- Celebration Pop-Up Modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-icon">💖</div>
      <h2 id="modal-title"></h2>
      <p id="modal-thanks" class="thank-you-note"></p>
      <p id="modal-visits"></p>

      <div id="promo-box" class="promo-box" style="display: none;"></div>
      <div id="referral-box" class="promo-box" style="display: none; background: #fdf2f8; border-color: #f9a8d4; color: #9d174d;"></div>

      <div id="reward-box" class="reward-box" style="display: none;">
        <div id="reward-text"></div>
        <button type="button" id="redeem-btn" class="btn-redeem">🎁 Redeem 1 Discount Now</button>
      </div>

      <p id="redeem-status" style="color: #15803d; font-weight: 700; font-size: 14px;"></p>
      <button type="button" id="done-btn" class="btn-done">Done (Next Guest) 💕</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
